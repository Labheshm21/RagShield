[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ragshield"
version = "0.1.0"
description = "A reproducible security evaluation harness for retrieval-augmented generation"
requires-python = ">=3.11"
dependencies = [
  "beautifulsoup4>=4.12",
  "fastapi>=0.115",
  "pydantic>=2.8",
  "pypdf>=5.0",
  "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
dev = ["httpx>=0.27", "pytest>=8.3"]

[project.scripts]
ragshield-eval = "ragshield.evaluation:main"
ragshield-api = "ragshield.api:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

